<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pušis Prototype</title>
<style>
:root { --bg:#f3f3f0; --paper:#fff; --fg:#1d1d1f; --muted:#6b6b68; --line:#c9c9c4; --soft:#e4e4df; --what:#a23b4a; --when:#4a4f55; --info:#3f6e9a;
  --booked:#7d8185; --free:#eeeeea; --ok:#2f6b3a; --warn:#b3261e; --amber:#a87400; --dont:#c97a1a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141618; --paper:#1d2023; --fg:#e8e8e6; --muted:#9a9a96; --line:#4a4e52; --soft:#30343a; --booked:#5a5f64; --free:#262a2e; } }
:root[data-theme="dark"] { --bg:#141618; --paper:#1d2023; --fg:#e8e8e6; --muted:#9a9a96; --line:#4a4e52; --soft:#30343a; --booked:#5a5f64; --free:#262a2e; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:var(--paper); border:1px solid var(--line); border-radius:5px; padding:2px 9px; }
button:hover { border-color:var(--fg); } button.pri { background:var(--fg); color:var(--paper); border-color:var(--fg); }
button.link { border:none; background:none; padding:0 2px; color:var(--info); text-decoration:underline; }
input, select, textarea { background:var(--paper); border:1px solid var(--line); border-radius:5px; padding:4px 7px; width:100%; }
input[type=checkbox] { width:auto; }
header { position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:1px solid var(--soft); padding:8px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.logo { font-weight:700; }
nav { display:flex; gap:8px; flex-wrap:wrap; }
.grp { display:flex; gap:2px; align-items:center; border-radius:16px; padding:2px 5px; }
.grp i { font-style:normal; font-size:10px; font-weight:700; letter-spacing:.06em; margin-right:3px; }
.grp.what { background:color-mix(in srgb, var(--what) 12%, transparent); } .grp.what i { color:var(--what); }
.grp.when { background:var(--free); } .grp.when i { color:var(--muted); }
.grp.info { background:color-mix(in srgb, var(--info) 12%, transparent); } .grp.info i { color:var(--info); }
.tab { border:1px solid transparent; background:none; border-radius:14px; padding:2px 9px; font-size:13px; }
.tab.on { border-color:var(--fg); font-weight:600; background:var(--paper); }
.sp { flex:1; }
.pill { border:1.5px solid var(--ok); color:var(--ok); border-radius:14px; padding:1px 9px; font-size:12px; }
.pill.amber { border-color:var(--amber); color:var(--amber); } .pill.red { border-color:var(--warn); color:var(--warn); }
.plus { width:30px; height:30px; border-radius:50%; font-weight:700; padding:0; }
main { max-width:1200px; margin:0 auto; padding:16px; }
h2 { margin:0 0 10px; font-size:18px; } h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:6px; }
.card { background:var(--paper); border:1px solid var(--soft); border-radius:8px; padding:10px 12px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .grid3 { display:grid; grid-template-columns:220px 1fr 1fr; gap:12px; }
.col { display:grid; gap:12px; align-content:start; }
.row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed var(--soft); }
.row:last-child { border-bottom:none; } .row.sel { background:var(--free); border-radius:4px; padding-left:6px; padding-right:6px; }
.row .grow { flex:1; min-width:0; } .clk { cursor:pointer; }
.m { color:var(--muted); font-size:12px; } .late { color:var(--warn); font-weight:600; } .due { color:var(--amber); font-weight:600; }
.code { font-family:ui-monospace, Consolas, monospace; font-size:12px; color:var(--muted); margin-right:5px; }
.imp { color:var(--warn); font-weight:700; margin-right:3px; }
.eyes { color:var(--what); letter-spacing:-2px; font-size:15px; margin-right:4px; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
.done { text-decoration:line-through; color:var(--muted); }
.ms { padding-left:24px; font-size:12px; color:var(--muted); } .ms span { margin-right:10px; }
.hours { display:grid; grid-template-columns:42px 1fr; gap:3px 6px; font-size:12.5px; }
.hours .h { color:var(--muted); text-align:right; padding-top:3px; }
.slot { min-height:26px; border-radius:4px; padding:3px 7px; border:1px dashed var(--line); color:var(--muted); cursor:pointer; }
.slot.booked { background:var(--booked); color:#fff; border:none; } .slot.planned { background:var(--free); color:var(--fg); border:none; border-left:4px solid var(--info); }
.slot.cont { opacity:.55; }
.strip { display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:4px; font-size:11px; text-align:center; }
.strip label { border:1px solid var(--soft); border-radius:4px; padding:3px 2px; display:block; } .strip input { text-align:center; padding:1px; font-size:12px; }
.steps { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px; }
.steps button { border-radius:14px; font-size:12px; } .steps button.on { background:var(--fg); color:var(--paper); }
.dont { border-left:4px solid var(--dont); }
.dayhead { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.dayhead input { width:auto; }
table.sheet { width:100%; border-collapse:collapse; font-size:13px; }
table.sheet th { text-align:left; font-size:11px; color:var(--muted); font-weight:600; border-bottom:1px solid var(--soft); padding:4px; }
table.sheet td { border-bottom:1px dashed var(--soft); padding:4px; vertical-align:top; }
table.sheet tr.sel td { background:var(--free); }
.sheethead { background:var(--what); color:#fff; border-radius:6px 6px 0 0; padding:5px 10px; font-weight:600; display:flex; justify-content:space-between; margin:-10px -12px 8px; }
dialog { border:2px solid var(--fg); border-radius:10px; background:var(--paper); color:var(--fg); max-width:560px; width:calc(100% - 32px); padding:14px; }
dialog::backdrop { background:rgba(0,0,0,.35); }
.fld { display:grid; gap:2px; margin-bottom:8px; font-size:12px; } .fld > span { color:var(--muted); }
.fld.chk { display:flex; gap:6px; align-items:center; font-size:13px; }
.frow { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; }
.btns { display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; margin-top:8px; }
.toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--fg); color:var(--paper); padding:6px 14px; border-radius:16px; font-size:13px; }
.empty { color:var(--muted); font-style:italic; font-size:13px; padding:4px 0; }
@media (max-width:820px) { .grid2, .grid3 { grid-template-columns:1fr; } .strip { grid-template-columns:repeat(5, 1fr); } }
</style></head><body>
<header>
 <span class="logo">🌲 Pušis <span class="m">prototype v2</span></span>
 <nav id="nav"></nav>
 <span class="sp"></span>
 <span id="flapsi" class="pill" title="Loose things: notes in inbox + overdue tasks and activities (Pušis extension, not a TMI rule)"></span>
 <button class="plus" data-a="capture" title="Capture (N)">+</button>
 <button data-a="menu" title="Backup and settings">⋯</button>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script>
'use strict';
// ---------- storage ----------
// shortcut: localStorage (one browser, ~5 MB); move to IndexedDB in the MVP as plan_v4 §6 says.
const KEY = 'pusis.proto.v1';
const COLOURS = ['#5b7fa6', '#7a9a5b', '#b07a4f', '#9a6aa0', '#5a9a9a', '#a65b5b', '#7b7b3a', '#3a6b7b', '#8a6d3b'];
function seed() {
  const names = [['Work', 'making the money'], ['Personal development', 'sharpen the saw'], ['Family & kids', ''], ['Friends', 'making the fun'], ['Prof. assoc / NGO', 'networking']];
  return { seq: 1, goals: [], tasks: [], acts: [], minors: [], ideas: [], notes: [], blocks: [], days: {},
    areas: names.map(([name, desc], i) => ({ slot: i + 1, name, desc, colour: COLOURS[i], goalIds: [], nextTask: 1 })) };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { S = seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save in this browser — export a backup (⋯)'); } }
const id = () => S.seq++;

// ---------- dates ----------
const pad = n => String(n).padStart(2, '0');
const d2s = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const s2d = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (s, n) => { const d = s2d(s); d.setDate(d.getDate() + n); return d2s(d); };
const TODAY = d2s(new Date());
function isoWeek(s) { const d = s2d(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); }
const dayOfYear = s => Math.round((s2d(s) - new Date(s2d(s).getFullYear(), 0, 1)) / 864e5) + 1;
const dayName = s => s2d(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const hh = h => `${pad(Math.floor(h))}:${h % 1 ? '30' : '00'}`;
const WIN = [8, 21]; // paper daily plan: 08–21

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const area = slot => S.areas.find(a => a.slot === +slot);
const task = tid => S.tasks.find(t => t.id === +tid);
const act = aid => S.acts.find(a => a.id === +aid);
const goal = gid => S.goals.find(g => g.id === +gid);
const tcode = t => `${t.area}.${t.n}`;
const acode = a => { const t = task(a.taskId); return t ? `${tcode(t)}.${a.n}` : '·'; };
const day = s => S.days[s] || (S.days[s] = { tasks: [], acts: [], elephant: '', areaMin: {} });
const eyes = g => ({ draft: '○○', committed: '●○', achieved: '●●', dropped: '✕' }[g.mark]);
const dueTag = (date, ref) => !date ? '' : date < ref ? `<span class="late">late ${esc(date.slice(5))}</span>` : date === ref ? '<span class="due">due today</span>' : `<span class="m">${esc(date.slice(5))}</span>`;
const linkTag = l => l ? ` <a href="${esc(/^[a-z]+:/i.test(l) ? l : 'file:///' + l)}" target="_blank" rel="noopener" title="${esc(l)}">🔗</a>` : '';
const whoTag = w => w && w !== 'me' ? ` <span class="m">· ${esc(w)}</span>` : '';
function toast(msg) { document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2600); }
const openTask = t => t.status === 'open';
const goalLabel = t => { const g = goal(t.goalId); if (!g) return t.kind === 'ongoing' ? 'ongoing' : ''; return `${g.side === 'work' ? 'W' : 'P'}${g.slot}${t.ms ? '①②③'[t.ms - 1] : ''}`; };

// candidate order for Plan tomorrow (plan_v3 UC25): late → ! important → deadline → serves a goal
function sortCandidates(list, ref) {
  const k = t => [t.deadline && t.deadline < ref ? 0 : 1, t.important ? 0 : 1, t.deadline || '9999', t.goalId ? 0 : 1];
  return [...list].sort((a, b) => { const x = k(a), y = k(b); for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1; return 0; });
}
const blocksOn = s => S.blocks.filter(b => b.date === s).sort((a, b) => a.start - b.start);
const availableH = s => (WIN[1] - WIN[0]) - blocksOn(s).reduce((n, b) => n + Math.max(0, Math.min(b.end, WIN[1]) - Math.max(b.start, WIN[0])), 0);
const fmtH = h => `${Math.floor(h)} h${h % 1 ? ' 30' : ''}`;

// items shown on a date (K2: due/overdue appear automatically, plus what Plan tomorrow put there)
function itemsFor(s) {
  const d = day(s), isToday = s === TODAY;
  const showT = t => d.tasks.includes(t.id) || (openTask(t) && t.kind !== 'ongoing' && t.deadline && (t.deadline === s || (isToday && t.deadline < s)));
  const showA = a => d.acts.includes(a.id) || (!a.done && a.by && (a.by === s || (isToday && a.by < s)));
  const acts = S.acts.filter(showA);
  return { tasks: S.tasks.filter(t => t.status !== 'archived' && showT(t)), acts: acts.filter(a => a.kind === 'do'), calls: acts.filter(a => a.kind !== 'do') };
}

// ---------- UI state ----------
const U = { view: 'today', area: 1, task: null, date: TODAY, step: 1, ideasAll: false };
const VIEWS = { goals: 'WHAT', areas: 'WHAT', today: 'WHEN', plan: 'WHEN', dont: 'WHEN', notes: 'INFO' };
function nav() {
  const t = (v, label) => `<button class="tab ${U.view === v ? 'on' : ''}" data-a="go" data-v="${v}">${label}</button>`;
  document.getElementById('nav').innerHTML =
    `<span class="grp what"><i>WHAT</i>${t('goals', '🌈 Goals')}${t('areas', '🔑 Key areas')}</span>` +
    `<span class="grp when"><i>WHEN</i>${t('today', '🕘 Today')}${t('plan', '🌙 Plan tomorrow')}${t('dont', '✋ Don\'t forget')}</span>` +
    `<span class="grp info"><i>INFO</i>${t('notes', '✏️ Notes')}<button class="tab" disabled title="MVP (phase 1)">📞 People</button><button class="tab" disabled title="MVP (phase 1)">ℹ️ Reference</button></span>`;
  const late = S.tasks.filter(t => openTask(t) && t.deadline && t.deadline < TODAY).length + S.acts.filter(a => !a.done && a.by && a.by < TODAY).length;
  const n = S.notes.length + late, f = document.getElementById('flapsi');
  f.textContent = `Flapsi ${n}`; f.className = 'pill' + (n > 10 ? ' red' : n > 7 ? ' amber' : '');
}
function render() { nav(); document.getElementById('app').innerHTML = V[U.view](); save(); }

// ---------- views ----------
const V = {};
V.goals = () => {
  const side = (sd, label) => {
    const rows = [1, 2, 3, 4, 5, 6].map(slot => {
      const g = S.goals.find(x => x.side === sd && x.slot === slot && x.mark !== 'dropped');
      if (!g) return `<div class="row"><span class="empty">slot ${slot}</span><button data-a="goalEdit" data-side="${sd}" data-slot="${slot}">+ goal</button></div>`;
      const ms = g.ms.filter(m => m.title).map((m, i) => `<span class="${m.done ? 'done' : ''}">${'①②③'[i]} ${esc(m.title)} ${m.due ? '· ' + esc(m.due) : ''}</span>`).join('');
      const rules = Object.values(g.rules).filter(Boolean).length + (g.due ? 1 : 0);
      return `<div class="row"><span class="grow"><span class="eyes" title="${g.mark}">${eyes(g)}</span><b>${label[0]}${slot} ${esc(g.title)}</b> <span class="m">· ${esc(g.due || 'no deadline')} · TMI rules ${rules}/5</span></span><button data-a="goalEdit" data-gid="${g.id}">edit</button></div>${ms ? `<div class="ms">${ms}</div>` : ''}`;
    }).join('');
    return `<div class="card"><h3>${label} · ${S.goals.filter(g => g.side === sd && g.mark !== 'dropped').length} / 6</h3>${rows}</div>`;
  };
  return `<h2>🌈 Goals <span class="m">— the decision base. ○○ draft → ●○ signed (committed) → ●● achieved</span></h2><div class="grid2">${side('personal', 'Personal')}${side('work', 'Work')}</div>`;
};

V.areas = () => {
  const a = area(U.area);
  const list = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(slot => {
    const x = area(slot);
    if (!x) return `<div class="row"><span class="empty">${slot} free</span><button data-a="areaEdit" data-slot="${slot}">+</button></div>`;
    const n = S.tasks.filter(t => t.area === slot && openTask(t)).length;
    return `<div class="row clk ${U.area === slot ? 'sel' : ''}" data-a="pickArea" data-slot="${slot}"><span class="grow"><span class="sw" style="background:${x.colour}"></span><b>${slot}</b> ${esc(x.name)}</span><span class="m">${n}</span></div>`;
  }).join('') + `<div class="row clk ${U.area === 0 ? 'sel' : ''}" data-a="pickArea" data-slot="0"><span class="grow">💡 <b>0</b> Ideas</span><span class="m">${S.ideas.filter(i => i.status === 'open').length}</span></div>`;
  let mid = '', right = '';
  if (U.area === 0) {
    const ideas = S.ideas.filter(i => U.ideasAll || i.status === 'open');
    mid = `<div class="card"><h3>💡 Ideas bank <button class="link" data-a="ideasAll">${U.ideasAll ? 'open only' : 'show all'}</button></h3>
      <form data-f="addIdea" style="display:flex; gap:6px; margin-bottom:6px"><input name="text" placeholder="New idea…" required><button class="pri">add</button></form>
      ${ideas.map(i => `<div class="row"><span class="grow ${i.status !== 'open' ? 'done' : ''}">${esc(i.text)} ${i.status !== 'open' ? `<span class="m">(${i.status})</span>` : ''}</span>${i.status === 'open' ? `<button data-a="ideaToTask" data-id="${i.id}">→ task</button><button data-a="ideaDiscard" data-id="${i.id}">discard</button>` : ''}</div>`).join('') || '<div class="empty">No ideas yet.</div>'}</div>`;
    right = `<div class="card m">Note ideas the moment they come. Review them regularly: turn the good ones into tasks, discard the rest. Transferred and discarded ideas are ticked off so you don't reconsider them (TMI Key Results).</div>`;
  } else if (!a) {
    mid = `<div class="card empty">Key area ${U.area} is free. <button data-a="areaEdit" data-slot="${U.area}">create it</button></div>`;
  } else {
    const ts = S.tasks.filter(t => t.area === a.slot && t.status !== 'archived').sort((x, y) => x.n - y.n);
    const sel = task(U.task);
    mid = `<div class="card"><div class="sheethead"><span>🔑 ${esc(a.name)} — task sheet</span><span># ${a.slot} <button class="link" style="color:#fff" data-a="areaEdit" data-slot="${a.slot}">edit area</button></span></div>
      ${a.desc ? `<div class="m">${esc(a.desc)}${a.goalIds.length ? ' · serves ' + a.goalIds.map(g => goal(g)).filter(Boolean).map(g => esc(g.title)).join(', ') : ''}</div>` : ''}
      <table class="sheet"><tr><th>#</th><th>!</th><th>Task</th><th>Who</th><th>⏰</th><th>Goal</th><th>✓</th></tr>
      ${ts.map(t => `<tr class="clk ${sel && sel.id === t.id ? 'sel' : ''}" data-a="pickTask" data-id="${t.id}"><td class="code">${tcode(t)}</td><td class="imp">${t.important ? '!' : ''}</td><td class="${t.status === 'done' ? 'done' : ''}">${esc(t.what)}${linkTag(t.link)}</td><td>${esc(t.who || 'me')}</td><td>${dueTag(t.deadline, TODAY)}</td><td class="m">${esc(goalLabel(t))}</td><td>${t.kind === 'ongoing' ? '<span class="m" title="ongoing task">∞</span>' : `<input type="checkbox" data-c="taskDone" data-id="${t.id}" ${t.status === 'done' ? 'checked' : ''}>`}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">No tasks yet.</td></tr>'}
      </table><div class="btns" style="justify-content:flex-start"><button class="pri" data-a="taskEdit">+ task</button>${sel ? `<button data-a="taskEdit" data-id="${sel.id}">edit ${tcode(sel)}</button>` : ''}</div></div>`;
    if (sel && sel.area === a.slot) {
      const as = S.acts.filter(x => x.taskId === sel.id).sort((x, y) => x.n - y.n);
      right = `<div class="card"><div class="sheethead"><span>■ ${esc(sel.what)} — activities</span><span># ${tcode(sel)}</span></div>
        <table class="sheet"><tr><th>#</th><th>Who</th><th>Activity</th><th></th><th>⏰</th><th>✓</th></tr>
        ${as.map(x => `<tr><td class="code">${acode(x)}</td><td>${esc(x.who || 'me')}</td><td class="${x.done ? 'done' : ''}"><button class="link" data-a="actEdit" data-id="${x.id}">${esc(x.what)}</button>${linkTag(x.link)}</td><td>${{ do: '', call: '📞', email: '@' }[x.kind]}</td><td>${dueTag(x.by, TODAY)}</td><td><input type="checkbox" data-c="actDone" data-id="${x.id}" ${x.done ? 'checked' : ''}></td></tr>`).join('') || '<tr><td colspan="6" class="empty">No activities. Split the task when it needs several steps or people.</td></tr>'}
        </table><div class="btns" style="justify-content:flex-start"><button class="pri" data-a="actEdit" data-task="${sel.id}">+ activity</button></div></div>`;
    } else right = `<div class="card empty">Select a task to see its activity sheet.</div>`;
  }
  return `<h2>🔑 Key areas <span class="m">— key areas | task sheet | activity sheet (the Key Results "triple view")</span></h2><div class="grid3"><div class="card"><h3>Key areas</h3>${list}</div>${mid}${right}</div>`;
};

function hoursCol(s) {
  const bs = blocksOn(s); let out = '';
  for (let h = WIN[0]; h < WIN[1]; h += 0.5) {
    const b = bs.find(x => x.start <= h && h < x.end);
    if (h % 1 && !b) continue; // show half hours only when a block uses them
    if (!b) { out += `<span class="h">${hh(h)}</span><div class="slot" data-a="booked" data-date="${s}" data-h="${h}">available</div>`; continue; }
    const first = b.start === h || (h === WIN[0] && b.start < h), t = task(b.taskId), a = area(b.area);
    const label = b.kind === 'planned' && t ? `<span class="code">${tcode(t)}</span>${esc(t.what)}` : esc(b.title);

// form(title, fields, onSave, extra): fields {k, label, type, value, options:[[v,label]], req}; extra: [[label, fn]]
function form(title, fields, onSave, extra = []) {
  const dlg = document.getElementById('dlg');
  const f = x => x.type === 'check'
    ? `<label class="fld chk"><input type="checkbox" name="${x.k}" ${x.value ? 'checked' : ''}>${esc(x.label)}</label>`
    : `<label class="fld"><span>${esc(x.label)}</span>${x.type === 'select'
      ? `<select name="${x.k}">${x.options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(x.value ?? '') ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`
      : x.type === 'textarea' ? `<textarea name="${x.k}" rows="2">${esc(x.value)}</textarea>`
      : `<input name="${x.k}" type="${x.type || 'text'}" value="${esc(x.value)}" ${x.req ? 'required' : ''} ${x.list ? `list="${x.list}"` : ''} ${x.ph ? `placeholder="${esc(x.ph)}"` : ''} ${x.type === 'number' ? 'step="0.5" min="0"' : ''}>`}</label>`;
  const rows = fields.map(x => Array.isArray(x) ? `<div class="frow">${x.map(f).join('')}</div>` : f(x)).join('');
  const people = [...new Set([...S.tasks.map(t => t.who), ...S.acts.map(a => a.who)].filter(w => w && w !== 'me'))];
  dlg.innerHTML = `<form method="dialog"><h3 style="font-size:14px;color:var(--fg)">${esc(title)}<button type="button" value="x" data-x>✕</button></h3>${rows}
    <datalist id="people">${people.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <div class="btns">${extra.map((e, i) => `<button type="button" data-extra="${i}">${esc(e[0])}</button>`).join('')}<button class="pri" value="ok">save</button></div></form>`;
  const fm = dlg.querySelector('form');
  const vals = () => Object.fromEntries(fields.flat().map(x => [x.k, x.type === 'check' ? fm.elements[x.k].checked : fm.elements[x.k].value.trim()]));
  fm.onsubmit = e => { e.preventDefault(); if (onSave(vals()) !== false) { dlg.close(); render(); } };
  dlg.querySelector('[data-x]').onclick = () => dlg.close();
  extra.forEach((e, i) => dlg.querySelector(`[data-extra="${i}"]`).onclick = () => { if (e[1](vals()) !== false) { dlg.close(); render(); } });
  dlg.showModal();
}

function goalOpts() {

};
